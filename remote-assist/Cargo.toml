[package]
name = "snapkey-remote-assist"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
eframe = "=0.29.1"
reqwest = { version = "=0.12.9", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tungstenite = { version = "=0.24.0", features = ["rustls-tls-native-roots"] }
serde_json = "=1.0.133"
url = "=2.5.4"
screenshots = "=0.8.10"
image = { version = "=0.24.9", default-features = false, features = ["jpeg"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"
